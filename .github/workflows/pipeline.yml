# Runs the keyless SeoulPulse pipeline every 30 minutes and publishes public/trends.json to GitHub Pages.
# Repository settings: Pages source = "GitHub Actions"; variable SP_CONTACT (contact URL or email for the
# Wikimedia User-Agent).
# Optional secrets: YOUTUBE_API_KEY (YouTube Data API pass), NAVER_CLIENT_ID + NAVER_CLIENT_SECRET (Naver DataLab
# "Korean search spike" signal; both required). Optional variables: SP_YOUTUBE_DAILY_UNITS (default 9000),
# SP_NAVER_ENDPOINT (auto/hub/developers). Empty values are treated as unset by the backend.
# Optional LLM why-lines: variable SP_WHY_LLM=1 plus secret ANTHROPIC_API_KEY (variable SP_LLM_MODEL overrides the model).
name: pipeline

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency: pipeline

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          working-directory: backend

      # SQLite state (history for velocity, rank change and baselines) persists between runs via the cache.
      # public/ is cached too, so "keep the last good trends.json" works when every source fails.
      # Cache entries are immutable, so every run *attempt* saves under its own key; restore always falls back
      # to the newest entry with the sp-state- prefix (reruns get the latest state, not the original attempt's).
      - name: Restore pipeline state
        uses: actions/cache/restore@v4
        with:
          path: |
            backend/var
            public
          key: sp-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sp-state-

      - name: Install
        working-directory: backend
        env:
          SP_WHY_LLM: ${{ vars.SP_WHY_LLM || '0' }}
        run: |
          if [ "$SP_WHY_LLM" = "1" ]; then
            uv sync --frozen --extra llm
          else
            uv sync --frozen
          fi

      - name: Run pipeline
        working-directory: backend
        env:
          SP_CONTACT: ${{ vars.SP_CONTACT }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SP_YOUTUBE_DAILY_UNITS: ${{ vars.SP_YOUTUBE_DAILY_UNITS }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          SP_NAVER_ENDPOINT: ${{ vars.SP_NAVER_ENDPOINT }}
          SP_WHY_LLM: ${{ vars.SP_WHY_LLM || '0' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SP_LLM_MODEL: ${{ vars.SP_LLM_MODEL || 'claude-haiku-5-5' }}
        run: uv run seoulpulse run

      - name: Save pipeline state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            backend/var
            public
          key: sp-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Add static site pages (landing, privacy, support)
        run: cp -R site/. public/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-pages:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
