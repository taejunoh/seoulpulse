name: SeoulPulse
options:
  bundleIdPrefix: com.taejunoh
  deploymentTarget: {iOS: "18.0"}
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3BMF4LM6TM
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
targets:
  SeoulPulse:
    type: application
    platform: iOS
    sources: [SeoulPulse, Shared]          # Shared/Resources/sample-trends.json becomes a resource
    dependencies: [{target: SeoulPulseWidget, embed: true}]
    entitlements:
      path: SeoulPulse/SeoulPulse.entitlements
      properties: {com.apple.security.application-groups: [group.com.taejunoh.seoulpulse]}
    info:
      path: SeoulPulse/Info.plist
      properties:
        CFBundleDisplayName: Seoul Rising
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        SPTrendsURL: https://taejunoh.com/seoulpulse/trends.json
        SPAppGroupID: group.com.taejunoh.seoulpulse
        CFBundleURLTypes: [{CFBundleURLName: com.taejunoh.seoulpulse, CFBundleURLSchemes: [seoulpulse, seoulrising]}]
        NSAppTransportSecurity: {NSAllowsLocalNetworking: true}
        UILaunchScreen: {UIColorName: LaunchBackground}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taejunoh.seoulpulse
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  SeoulPulseWidget:
    type: app-extension
    platform: iOS
    sources: [SeoulPulseWidget, Shared]
    entitlements:
      path: SeoulPulseWidget/SeoulPulseWidget.entitlements
      properties: {com.apple.security.application-groups: [group.com.taejunoh.seoulpulse]}
    info:
      path: SeoulPulseWidget/Info.plist
      properties:
        CFBundleDisplayName: Seoul Rising
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension: {NSExtensionPointIdentifier: com.apple.widgetkit-extension}
        SPTrendsURL: https://taejunoh.com/seoulpulse/trends.json
        SPAppGroupID: group.com.taejunoh.seoulpulse
        NSAppTransportSecurity: {NSAllowsLocalNetworking: true}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taejunoh.seoulpulse.widget
        TARGETED_DEVICE_FAMILY: "1"
  SeoulPulseTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SeoulPulseTests]
    dependencies: [{target: SeoulPulse}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taejunoh.seoulpulse.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  SeoulPulse:
    build: {targets: {SeoulPulse: all, SeoulPulseWidget: all}}
    run: {config: Debug}
    test:
      config: Debug
      targets: [SeoulPulseTests]
      environmentVariables: {SP_SNAPSHOT_DIR: "$(SRCROOT)/build/snapshots"}
